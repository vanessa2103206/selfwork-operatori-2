<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfwork Operatori 2</title>
</head>
<body>

    <h1>Calcolo Età e Centenario</h1>
    <p>Fai click con il tasto destro sulla pagina, seleziona "Ispeziona" e vai sulla scheda "Console" per vedere il risultato finale!</p>

    <script>
        // 1. Creo le due variabili con l'anno corrente e l'anno di nascita
        let annoCorrente = 2026;
        let annoNascita = 1996; // Puoi cambiare questo anno con il tuo!

        // 2. Calcolo l'età attuale della persona (Sottrazione)
        let eta = annoCorrente - annoNascita;

        // 3. Calcolo quanti anni mancano per arrivare a 100
        let anniMancanti = 100 - eta;

        // 4. Mostro in console la frase esatta richiesta dalla traccia
        console.log("Hai " + eta + " anni e ti mancano " + anniMancanti + " anni per compierne 100");
    </script>
</body>
</html>
